services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-attendance-db:/var/lib/postgresql/data

  odoo:
    image: odoo:19
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8070:8069"
    volumes:
      - odoo-attendance-web:/var/lib/odoo
      - ./extra-addons:/mnt/extra-addons
    command: 
          odoo
          --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
volumes:
  odoo-attendance-db:
  odoo-attendance-web: